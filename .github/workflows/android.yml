name: Android build and core tests
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
    tags:
      - 'android-v*'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" 'platforms;android-36' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'SDK setup failed' }
      - name: Core tests and build with CI-only key
        shell: pwsh
        run: |
          ./android/test-core.ps1 -JavaBin "$env:JAVA_HOME/bin"
          ./android/build.ps1 -Sdk $env:ANDROID_HOME -JavaBin "$env:JAVA_HOME/bin" -Ci
      - uses: actions/upload-artifact@v4
        with:
          name: Stroik-Android-CI-only
          path: android/releases/*
